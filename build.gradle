buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = "https://nexus.gtnewhorizons.com/repository/public/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        maven { url = "https://jitpack.io" }
        maven { url = "https://cursemaven.com" }
    }
    dependencies {
        classpath("com.gtnewhorizons:retrofuturagradle:2.0.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.10")
    }
}

apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'com.gtnewhorizons.retrofuturagradle'
apply plugin: 'kotlin'
apply plugin: 'kotlin-kapt'

version = "1.0.0-GTNH"
group = "com.juicestudio.gtnh.replayfix"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mcVersion.set("1.7.10")
    mcpMappingChannel.set("stable")
    mcpMappingVersion.set("12")
    username.set("Developer")
}

repositories {
    mavenCentral()
    maven { url = "https://nexus.gtnewhorizons.com/repository/releases/" }
    maven { url = "https://nexus.gtnewhorizons.com/repository/public/" }
    maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
    maven { url = "https://jitpack.io" }
}

configurations.all {
    resolutionStrategy.dependencySubstitution {
        substitute(module("com.github.bartimaeusnek:Forgelin"))
                .using(module("com.github.GTNewHorizons:Forgelin:2.0.3-GTNH"))
    }
}

dependencies {
    // 透過一般的 implementation 引入 Mixin，不需要依賴容易出錯的 mixingradle 外掛
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'

    // 僅在編譯期引入原生 LWJGL 3 API，執行期直接使用 lwjgl3ify 提供的環境
    compileOnly "org.lwjgl:lwjgl:3.3.3"
    compileOnly "org.lwjgl:lwjgl-glfw:3.3.3"
    compileOnly "org.lwjgl:lwjgl-opengl:3.3.3"

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs = ["-Xjvm-default=all"]
    }
}

jar {
    manifest.attributes(
            "FMLCorePlugin": "com.github.tonymoddinglab.replayfix.core.ReplayFixLoadingPlugin",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true",
            "MixinConfigs": "replayfix.mixins.json"
    )
}
tasks.named('runClient') {
    jvmArgs("-Dfml.coreMods.load=com.github.tonymoddinglab.replayfix.core.ReplayFixLoadingPlugin")
}

def rfgTaskMappings = [
        'compilePatchedMcKotlin'                  : 'decompressDecompiledSources',
        'kaptGenerateStubsPatchedMcKotlin'        : 'decompressDecompiledSources',
        'compileInjectedTagsKotlin'               : 'injectTags',
        'kaptGenerateStubsInjectedTagsKotlin'     : 'injectTags',
        'compileMcLauncherKotlin'                 : 'createMcLauncherFiles',
        'kaptGenerateStubsMcLauncherKotlin'       : 'createMcLauncherFiles',
        'compileInjectedInterfacesKotlin'         : 'generateInjectedInterfaces',
        'kaptGenerateStubsInjectedInterfacesKotlin': 'generateInjectedInterfaces'
]

rfgTaskMappings.each { targetTask, depTask ->
    tasks.matching { it.name == targetTask }.configureEach {
        if (tasks.findByName(depTask) != null) {
            dependsOn tasks.named(depTask)
        }
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
    jvmTargetValidationMode.set(org.jetbrains.kotlin.gradle.dsl.jvm.JvmTargetValidationMode.IGNORE)
}
