name: Bug Report
description: Report a bug, crash, or compatibility issue with ReplayFixGTNH in GTNH / lwjgl3ify
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide the details below to help us resolve the issue quickly.
  - type: input
    id: versions
    attributes:
      label: Version Information
      description: Please specify your GTNH version, lwjgl3ify version, and ReplayFixGTNH version.
      placeholder: e.g., GTNH 2.9.0 / lwjgl3ify v2.x / ReplayFixGTNH v1.0.0
    validations:
      required: true
  - type: textarea
    id: symptoms
    attributes:
      label: Description & Reproduction Steps
      description: Clear description of what happened and how to reproduce it.
      placeholder: 1. Click on the Replay button... 2. Game crashes...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash Logs / latest.log
      description: Please upload `logs/latest.log` or crash reports to Pastebin or paste them below in a code block. Do not screenshot text logs.
      placeholder: Paste crash log or stack trace here...
    validations:
      required: false
